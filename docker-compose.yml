services:
  postgres:
    image: postgres:16.11
    environment:
      POSTGRES_DB: perflab
      POSTGRES_USER: perflab
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
volumes:
  postgres_data:
